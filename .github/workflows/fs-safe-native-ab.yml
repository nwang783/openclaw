name: fs-safe native sandbox A/B

on:
  push:
    branches: [codex/fs-safe-0212-hosted-ab-20260928]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-sandbox-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout diagnostic controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Retain diagnostic outside candidate checkout
        run: cp .github/scripts/fs-safe-native-ab.sh "$RUNNER_TEMP/fs-safe-native-ab.sh"
      - name: Checkout exact PR candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bdf943d544a28efd560c5939548f5e075f65be7b
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare matching Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          semantic-checks: "true"
          install-bun: "false"
          cache-mode: "off"
      - name: Run exact native-hook file with fs-safe 0.21.2 and 0.21.1
        run: bash "$RUNNER_TEMP/fs-safe-native-ab.sh"
      - name: Upload complete A/B evidence including nonzero test exits
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fs-safe-native-sandbox-ab
          path: /tmp/oc-bump-0212-native-hook-ab-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
